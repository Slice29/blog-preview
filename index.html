<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Blog Preview Card</title>
    <link
      rel="icon"
      type="image/png"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body>
    <main
      class="flex min-h-screen items-center justify-center bg-yellow font-sans text-grey-950"
    >
      <div class="w-92 rounded-xl border border-black bg-white p-4 shadow-hard">
        <img
          class="rounded-xl"
          src="./assets/images/illustration-article.svg"
          alt="Illustration"
        />
        <p class="mt-5 w-1/4 bg-yellow py-1 text-center font-bold">Learning</p>
        <p class="my-3">Published 21 Dec 2023</p>
        <h1 class="text-2xl font-extrabold">HTML & CSS foundations</h1>
        <p class="text-grey-500">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="mt-4 flex items-center">
          <img
            src="./assets/images/image-avatar.webp"
            class="h-8 rounded-full"
            alt="Greg Hooper"
          />
          <span class="ml-2 font-extrabold">Greg Hooper</span>
        </div>
      </div>
    </main>
    <footer class="text-center text-xs">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Slice29</a>.
    </footer>
  </body>
</html>
